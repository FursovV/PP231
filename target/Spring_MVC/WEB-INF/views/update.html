<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать пользователя</title>
</head>
<body>
<h1>Редактировать пользователя</h1>

<form th:action="@{/users/update}" th:object="${user}" method="post">
    <input type="hidden" name="_method" value="patch">
    <input type="hidden" th:field="*{id}">
    <div>
        <label for="name">Имя:</label>
        <input type="text" id="name" th:field="*{name}" required>
        <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    </div>
    <div>
        <label for="surname">Фамилия:</label>
        <input type="text" id="surname" th:field="*{surname}" required>
        <div style="color:red" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">Surname error</div>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required>
        <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
    </div>
    <button type="submit">Обновить</button>
</form>

<br>
<a th:href="@{/users}">Назад к списку</a>
</body>
</html>
